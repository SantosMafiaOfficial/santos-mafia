<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VITTORIO MAFIA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            VITTORIO MAFIA
        </div>

        <ul>

            <li><a href="#home">HOME</a></li>

            <li><a href="#about">ABOUT</a></li>

            <li><a href="#apply">APPLY</a></li>

        </ul>

    </nav>


    <!-- HERO -->

    <section id="home" class="hero">

        <img src="file_00000000356c8246ad6672b465d34d8c.png
            " class="logo-image">

        <h1>VITTORIO MAFIA</h1>

        <p>
            Power • Loyalty • Respect
        </p>

        <button id="joinBtn">
            JOIN THE FAMILY
        </button>

    </section>


    <!-- ABOUT -->

    <section id="about" class="about">

        <h2>ABOUT US</h2>

        <p>

            Vittorio Mafia is an elite Italian-style family built on loyalty,
            discipline and respect.

            We do not recruit everyone.

            We recruit only those who earn their place.

        </p>

    </section>


    <!-- APPLICATION -->

    <section id="apply" class="application">

        <h2>MEMBERSHIP APPLICATION</h2>

        <form id="applyForm">

            <input
                type="text"
                placeholder="Nickname"
                required>

            <input
                type="number"
                placeholder="Age"
                required>

            <input
                type="text"
                placeholder="Discord Username"
                required>

            <input
                type="number"
                placeholder="Game Level"
                required>

            <input
                type="number"
                placeholder="AK Level"
                required>

            <input
                type="number"
                placeholder="Daily Activity (Hours)"
                required>

            <select required>

                <option value="">
                    Voice Chat
                </option>

                <option>
                    Yes
                </option>

                <option>
                    No
                </option>

            </select>

            <input
                type="text"
                placeholder="Previous Gang">

            <textarea
                placeholder="Why do you want to join Vittorio Mafia?"
                required></textarea>

            <button
                class="submit"
                type="submit">

                SEND APPLICATION

            </button>

        </form>

    </section>

    <script src="script.js"></script>

</body>

</html>
